name: Android release build

# Builds the signed Play-Store AAB (and an installable APK) on every push to
# main, and on manual runs from the Actions tab. Signing material comes from
# repository secrets — see docs/PUBLISHING.md for how to create them.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble web bundle
        run: node tools/copy-www.js

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME) with licenses
      # accepted — no setup-android action needed for a Capacitor build.

      - name: Decode signing keystore (or generate a temporary one)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/foliant-release.keystore
            echo "Using repository keystore secret."
          else
            echo "ANDROID_KEYSTORE_B64 not set — generating a TEMPORARY keystore."
            echo "The AAB below is for device testing only; uploads signed with this"
            echo "key cannot be updated later. See docs/PUBLISHING.md §2.1–2.2."
            keytool -genkeypair -v -keystore android/app/foliant-release.keystore \
              -alias foliant -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass foliant -keypass foliant -dname "CN=Foliant, OU=Dev, O=Personal, C=US"
          fi

      - name: Build signed AAB + APK
        working-directory: android
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew   # exec bit is lost when committing from Windows
          # Defaults match the temporary keystore; secrets override when present.
          CI_KEYSTORE_PASSWORD="${CI_KEYSTORE_PASSWORD:-foliant}" \
          CI_KEY_ALIAS="${CI_KEY_ALIAS:-foliant}" \
          CI_KEY_PASSWORD="${CI_KEY_PASSWORD:-foliant}" \
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: foliant-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (direct install)
        uses: actions/upload-artifact@v4
        with:
          name: foliant-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
